[project]
name = "maze"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "YorickFin", email = "87798691+YorickFin@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "pywebview>=6.2.1",
]

[project.scripts]
maze = "maze:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
pywebview = { index = "aliyun" }

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
