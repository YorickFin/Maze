# 迷宫生成与破解演示配置
# 修改后重启程序生效

[maze]
# 网格宽高（格），1 格 = 完整地图上的 1 像素
width = 1000
height = 1000

[generator]
# 随机种子；-1 表示每次运行都不同
seed = -1
# 节点阵列间距与位置抖动（格）
node_spacing = 100
node_jitter = 25
# 通道半径范围（格）：越大通道越宽
corridor_radius_min = 13
corridor_radius_max = 20
# 节点腔室半径范围（格）：通道交汇处的膨大部分
chamber_radius_min = 22
chamber_radius_max = 40
# 节点膨大腔室出现概率（0~1）：越小通道越顺滑
chamber_prob = 0.55
# 非生成树边额外连边概率（0~1）：越大环路越多
loop_prob = 0.12

[obstacle]
# 灰色障碍斑块数量与半径范围（格）
blobs = 12
radius_min = 12
radius_max = 26

[solver]
# 破解方视野边长（格）：只在该范围内相信「墙/通道可见」
view_size = 25
# 移动方向代价：右 1、上/下 3、左 10（天然右向优先，左向仅作回溯）
cost_right = 1.0
cost_vertical = 3.0
cost_left = 10.0
# 沿墙为主模式：右手法则（右→直→左→后）；默认关闭，改用前沿聚类
wall_follow = false
# 前沿聚类 + gain 效用（主策略）
cluster_enabled = true
cluster_gain_weight = 2.0
cluster_right_weight = 0.0
cluster_cost_weight = 1.0
cluster_min_size = 5
cluster_top_k = 4
cluster_gain_radius = 10
cluster_expand_limit = 10000
# 八向移动（规划 + 沿墙）；关闭即回到四向
allow_diagonal = true
# 对角移动代价系数（√2）
diagonal_factor = 1.414
# 穿过「已观测但未知」的疑似障碍格的附加代价（越大越倾向绕行）
suspect_penalty = 20.0
# 单次规划允许扩展的最大格数（防止极端地图上长时间阻塞）
plan_expand_limit = 200000
# 移动步数上限（防死循环）
max_steps = 500000
# 移动步进间隔（秒/步），保留字段
step_interval = 0.002

[visual]
# 每个网格在画布上的像素大小
cell_px = 2
