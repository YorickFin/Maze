# 迷宫生成与破解演示配置
# 修改后重启程序生效

[maze]
# 网格宽高（格）
width = 1000
height = 1000

# 障碍块尺寸范围（格）：最小 1x1，最大 (w/25)x(h/25)
# 由程序根据 width/height 自动计算，无需手动修改
# 可行动区域（非障碍）最小 1x1

[obstacle]
# 兼容字段（房间式生成不再使用覆盖率控制，保留以兼容配置结构）
count = 3000
ratio = 0.15
# 随机种子；-1 表示每次运行都不同
seed = -1

[corridor]
# 房间之间通道宽度范围（格）：1~5
min = 1
max = 5
# 非生成树边额外开洞概率（0~1）：越大房间间门越多、迷宫越连通
extra_prob = 0.4

[solver]
# 破解方视野边长（格）：10x10
view_size = 10
# 移动步进间隔（秒/步），越小越快
step_interval = 0.002
# A* 探测推进的步数上限（防死循环）
max_steps = 500000

[visual]
# 每个网格在画布上的像素大小
cell_px = 2
