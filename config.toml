# 迷宫生成与破解演示配置
# 修改后重启程序生效

[maze]
# 网格宽高（格），1 格 = 完整地图上的 1 像素
width = 1000
height = 1000

[generator]
# 随机种子；-1 表示每次运行都不同
seed = -1
# 节点阵列间距与位置抖动（格）
node_spacing = 100
node_jitter = 25
# 通道半径范围（格）：越大通道越宽
corridor_radius_min = 13
corridor_radius_max = 20
# 节点腔室半径范围（格）：通道交汇处的膨大部分
chamber_radius_min = 22
chamber_radius_max = 40
# 节点膨大腔室出现概率（0~1）：越小通道越顺滑
chamber_prob = 0.55
# 非生成树边额外连边概率（0~1）：越大环路越多
loop_prob = 0.12

[obstacle]
# 灰色障碍斑块数量与半径范围（格）
blobs = 12
radius_min = 12
radius_max = 26

[solver]
# 破解方视野边长（格）：10x10
view_size = 10
# 移动步进间隔（秒/步），越小越快
step_interval = 0.002
# A* 探测推进的步数上限（防死循环）
max_steps = 500000

[visual]
# 每个网格在画布上的像素大小
cell_px = 2
