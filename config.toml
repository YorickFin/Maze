# 迷宫生成与破解演示配置
# 修改后重启程序生效

[maze]
# 网格宽高（格）
width = 1000
height = 1000

# 障碍块尺寸范围（格）：最小 1x1，最大 (w/25)x(h/25)
# 由程序根据 width/height 自动计算，无需手动修改
# 可行动区域（非障碍）最小 1x1

[obstacle]
# 道路障碍块数量上限（随机散布在可行区域内，不覆盖起点与终点）
count = 3000
# 道路障碍目标覆盖率（0-1），达到后停止生成；过大易堵死
ratio = 0.15
# 随机种子；-1 表示每次运行都不同
seed = -1

[solver]
# 破解方视野边长（格）：10x10
view_size = 10
# 移动步进间隔（秒/步），越小越快
step_interval = 0.002
# A* 探测推进的步数上限（防死循环）
max_steps = 500000

[visual]
# 每个网格在画布上的像素大小
cell_px = 2
